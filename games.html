<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lucid - Games</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-image: url('background.png');
      background-repeat: repeat;
      background-size: 500px auto;
      animation: scroll 20s linear infinite;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
      background-color: #0f051d;
    }
    @keyframes scroll {
      from { background-position: 0 0; }
      to { background-position: 500px 500px; }
    }
    header {
      width: 100%;
      max-width: 840px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .nav-group {
      display: flex;
      gap: 8px;
    }
    .nav-btn, .logout-btn {
      background: rgba(26, 11, 46, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(168, 85, 247, 0.3);
      color: #e9d5ff;
      padding: 10px 14px;
      font-weight: 600;
      font-size: 13px;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .nav-btn:hover, .logout-btn:hover {
      background: rgba(147, 51, 234, 0.3);
      border-color: #c084fc;
      color: #fff;
      transform: translateY(-1px);
    }
    main {
      width: 100%;
      max-width: 840px;
    }
    .container {
      background: rgba(26, 11, 46, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 35px;
      border-radius: 20px;
      border: 1px solid rgba(168, 85, 247, 0.25);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(147, 51, 234, 0.15);
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      color: #f3e8ff;
      margin-bottom: 20px;
      letter-spacing: -0.5px;
    }
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 20px;
    }
    .game-card {
      background: rgba(15, 5, 29, 0.7);
      border: 1px solid rgba(168, 85, 247, 0.25);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }
    .game-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 15px 30px rgba(147, 51, 234, 0.25);
      border-color: #c084fc;
    }
    .game-thumbnail {
      height: 130px;
      background: linear-gradient(135deg, #7e22ce, #3b0764);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 1px;
    }
    .game-info {
      padding: 18px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }
    .game-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }
    .game-desc {
      font-size: 13px;
      color: #d8b4fe;
      margin-bottom: 16px;
      line-height: 1.4;
      opacity: 0.8;
    }
    .play-btn {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #a855f7, #7e22ce);
      border: none;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(168, 85, 247, 0.3);
    }
    .play-btn:hover {
      filter: brightness(1.1);
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-group">
      <a href="home.html" class="nav-btn">Dashboard</a>
      <a href="games.html" class="nav-btn" style="border-color: #c084fc; background: rgba(147, 51, 234, 0.3); color: #fff;">Games</a>
      <a href="friends.html" class="nav-btn">Friends</a>
    </div>
    <div class="nav-group">
      <a href="settings.html" class="nav-btn">Settings</a>
      <button class="logout-btn" id="logout-btn">Log Out</button>
    </div>
  </header>

  <main>
    <div class="container">
      <h1>Explore Games</h1>
      <div class="games-grid">
        
        <div class="game-card">
          <div class="game-thumbnail">TEST</div>
          <div class="game-info">
            <div>
              <div class="game-title">Test</div>
              <div class="game-desc">A test simulation environment for Lucid platform verification.</div>
            </div>
            <button class="play-btn" onclick="alert('Launching Test...')">Play Game</button>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script>
    function navigateTo(page) {
      const path = window.location.pathname;
      const dir = path.substring(0, path.lastIndexOf('/') + 1);
      window.location.href = window.location.origin + dir + page;
    }

    if (!localStorage.getItem('lucid_current_user')) {
      navigateTo('index.html');
    }

    document.getElementById('logout-btn').addEventListener('click', () => {
      localStorage.removeItem('lucid_current_user');
      navigateTo('index.html');
    });
  </script>
</body>
</html>
