<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lucid - Settings</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-image: url('background.png');
      background-repeat: repeat;
      background-size: 500px auto;
      animation: scroll 20s linear infinite;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
      background-color: #0f051d;
    }
    @keyframes scroll {
      from { background-position: 0 0; }
      to { background-position: 500px 500px; }
    }
    header {
      width: 100%;
      max-width: 540px;
      display: flex;
      justify-content: flex-start;
      margin-bottom: 24px;
    }
    .back-btn {
      background: rgba(26, 11, 46, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(168, 85, 247, 0.3);
      color: #e9d5ff;
      padding: 10px 18px;
      font-weight: 600;
      font-size: 14px;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .back-btn:hover {
      background: rgba(147, 51, 234, 0.3);
      border-color: #c084fc;
      color: #fff;
    }
    .box {
      background: rgba(26, 11, 46, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 35px;
      width: 100%;
      max-width: 540px;
      border-radius: 20px;
      border: 1px solid rgba(168, 85, 247, 0.25);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(147, 51, 234, 0.15);
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      color: #f3e8ff;
      margin-bottom: 24px;
      letter-spacing: -0.5px;
    }
    h2 {
      font-size: 16px;
      font-weight: 600;
      color: #c084fc;
      margin-top: 24px;
      margin-bottom: 14px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(168, 85, 247, 0.2);
    }
    .alert {
      color: #fca5a5;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 20px;
      padding: 12px;
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 10px;
      background: rgba(127, 29, 29, 0.3);
      display: none;
    }
    .success-alert {
      color: #86efac;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 20px;
      padding: 12px;
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-radius: 10px;
      background: rgba(20, 83, 45, 0.3);
      display: none;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #d8b4fe;
      margin-bottom: 6px;
    }
    input[type="text"], input[type="password"], select {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 12px;
      font-size: 15px;
      background: rgba(15, 5, 29, 0.6);
      color: #fff;
      transition: all 0.25s ease;
    }
    select option {
      background: #1a0b2e;
      color: #fff;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #c084fc;
      background-color: rgba(15, 5, 29, 0.9);
      box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.2);
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #a855f7, #7e22ce);
      border: none;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 6px;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
    }
    .btn:hover {
      filter: brightness(1.1);
    }
    .btn-danger {
      background: linear-gradient(135deg, #ef4444, #991b1b);
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
    }
  </style>
</head>
<body>

  <header>
    <a href="home.html" class="back-btn">&larr; Back to Dashboard</a>
  </header>

  <div class="box">
    <h1>Account Settings</h1>
    <div class="alert" id="settings-error"></div>
    <div class="success-alert" id="settings-success"></div>

    <!-- Section 1: Username Update -->
    <h2>Identity Profile</h2>
    <div class="form-group">
      <label>New Username</label>
      <input type="text" id="new-username" placeholder="Enter new username">
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="confirm-password-user" placeholder="Required to change username">
    </div>
    <button class="btn" id="save-username">Update Username</button>

    <!-- Section 2: Password Change -->
    <h2>Security & Password</h2>
    <div class="form-group">
      <label>Current Password</label>
      <input type="password" id="current-pass" placeholder="Enter current password">
    </div>
    <div class="form-group">
      <label>New Password</label>
      <input type="password" id="new-pass" placeholder="Enter new password">
    </div>
    <button class="btn" id="save-password">Update Password</button>

    <!-- Section 3: Preferences -->
    <h2>Preferences</h2>
    <div class="form-group">
      <label>Interface Glow Accent</label>
      <select id="theme-select">
        <option value="purple">Royal Purple (Default)</option>
        <option value="neon">Neon Cyber</option>
        <option value="midnight">Deep Midnight</option>
      </select>
    </div>
    <button class="btn" id="save-preferences">Save Preferences</button>

    <!-- Section 4: Danger Zone -->
    <h2>Danger Zone</h2>
    <button class="btn btn-danger" id="delete-account">Delete Account</button>
  </div>

  <script>
    function navigateTo(page) {
      const path = window.location.pathname;
      const dir = path.substring(0, path.lastIndexOf('/') + 1);
      window.location.href = window.location.origin + dir + page;
    }

    const currentUser = localStorage.getItem('lucid_current_user');
    if (!currentUser) {
      navigateTo('index.html');
    } else {
      document.getElementById('new-username').value = currentUser;
      let users = JSON.parse(localStorage.getItem('lucid_users')) || [];
      let userObj = users.find(u => u.username.toLowerCase() === currentUser.toLowerCase());
      if (userObj && userObj.theme) {
        document.getElementById('theme-select').value = userObj.theme;
      }
    }

    const errorEl = document.getElementById('settings-error');
    const successEl = document.getElementById('settings-success');

    function showAlert(msg, isSuccess = false) {
      errorEl.style.display = 'none';
      successEl.style.display = 'none';
      if (isSuccess) {
        successEl.textContent = msg;
        successEl.style.display = 'block';
      } else {
        errorEl.textContent = msg;
        errorEl.style.display = 'block';
      }
    }

    // 1. Update Username Handler
    document.getElementById('save-username').addEventListener('click', () => {
      const newName = document.getElementById('new-username').value.trim();
      const passwordVal = document.getElementById('confirm-password-user').value.trim();

      if (!newName || !passwordVal) {
        showAlert("Please fill out both your new username and password confirmation.");
        return;
      }

      let users = JSON.parse(localStorage.getItem('lucid_users')) || [];
      let userObj = users.find(u => u.username.toLowerCase() === currentUser.toLowerCase());

      if (!userObj || userObj.password !== passwordVal) {
        showAlert("Incorrect password verification.");
        return;
      }

      const nameTaken = users.some(u => u.username.toLowerCase() === newName.toLowerCase() && u.username.toLowerCase() !== currentUser.toLowerCase());
      if (nameTaken) {
        showAlert("That username is already taken by another account.");
        return;
      }

      userObj.username = newName;
      localStorage.setItem('lucid_users', JSON.stringify(users));
      localStorage.setItem('lucid_current_user', newName);
      showAlert("Username updated successfully!", true);
      setTimeout(() => location.reload(), 1000);
    });

    // 2. Update Password Handler
    document.getElementById('save-password').addEventListener('click', () => {
      const currPass = document.getElementById('current-pass').value.trim();
      const newPass = document.getElementById('new-pass').value.trim();

      if (!currPass || !newPass) {
        showAlert("Please fill out both password fields.");
        return;
      }

      let users = JSON.parse(localStorage.getItem('lucid_users')) || [];
      let userObj = users.find(u => u.username.toLowerCase() === currentUser.toLowerCase());

      if (!userObj || userObj.password !== currPass) {
        showAlert("Current password is incorrect.");
        return;
      }

      userObj.password = newPass;
      localStorage.setItem('lucid_users', JSON.stringify(users));
      document.getElementById('current-pass').value = '';
      document.getElementById('new-pass').value = '';
      showAlert("Password updated successfully!", true);
    });

    // 3. Save Preferences Handler
    document.getElementById('save-preferences').addEventListener('click', () => {
      const selectedTheme = document.getElementById('theme-select').value;
      let users = JSON.parse(localStorage.getItem('lucid_users')) || [];
      let userObj = users.find(u => u.username.toLowerCase() === currentUser.toLowerCase());
      if (userObj) {
        userObj.theme = selectedTheme;
        localStorage.setItem('lucid_users', JSON.stringify(users));
      }
      showAlert("Preferences saved successfully!", true);
    });

    // 4. Delete Account Handler
    document.getElementById('delete-account').addEventListener('click', () => {
      if (confirm("Are you completely sure you want to delete your Lucid account? This action cannot be undone.")) {
        let users = JSON.parse(localStorage.getItem('lucid_users')) || [];
        users = users.filter(u => u.username.toLowerCase() !== currentUser.toLowerCase());
        localStorage.setItem('lucid_users', JSON.stringify(users));
        localStorage.removeItem('lucid_current_user');
        alert("Account deleted.");
        navigateTo('index.html');
      }
    });
  </script>
</body>
</html>
