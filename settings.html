<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lucid - Settings</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-image: url('background.png');
      background-repeat: repeat;
      background-size: 500px auto;
      animation: scroll 20s linear infinite;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
      background-color: #0f051d;
    }
    @keyframes scroll {
      from { background-position: 0 0; }
      to { background-position: 500px 500px; }
    }
    header {
      width: 100%;
      max-width: 680px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .nav-group {
      display: flex;
      gap: 8px;
    }
    .nav-btn, .logout-btn {
      background: rgba(26, 11, 46, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(168, 85, 247, 0.3);
      color: #e9d5ff;
      padding: 10px 14px;
      font-weight: 600;
      font-size: 13px;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .nav-btn:hover, .logout-btn:hover {
      background: rgba(147, 51, 234, 0.3);
      border-color: #c084fc;
      color: #fff;
      transform: translateY(-1px);
    }
    main {
      width: 100%;
      max-width: 680px;
    }
    .container {
      background: rgba(26, 11, 46, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 35px;
      border-radius: 20px;
      border: 1px solid rgba(168, 85, 247, 0.25);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(147, 51, 234, 0.15);
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      color: #f3e8ff;
      margin-bottom: 24px;
      letter-spacing: -0.5px;
    }
    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: #f3e8ff;
      margin-bottom: 14px;
    }
    .divider-line {
      height: 1px;
      background: rgba(168, 85, 247, 0.25);
      margin: 24px 0;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }
    .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: #d8b4fe;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 12px;
      font-size: 14px;
      background: rgba(15, 5, 29, 0.6);
      color: #fff;
    }
    .form-group input:focus {
      outline: none;
      border-color: #c084fc;
      background-color: rgba(15, 5, 29, 0.9);
      box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.2);
    }
    .action-btn {
      padding: 12px 20px;
      background: linear-gradient(135deg, #a855f7, #7e22ce);
      border: none;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
      width: 100%;
    }
    .action-btn:hover {
      filter: brightness(1.1);
    }
    .danger-btn {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-group">
      <a href="home.html" class="nav-btn">Dashboard</a>
      <a href="games.html" class="nav-btn">Games</a>
      <a href="friends.html" class="nav-btn">Friends</a>
    </div>
    <div class="nav-group">
      <a href="settings.html" class="nav-btn" style="border-color: #c084fc; background: rgba(147, 51, 234, 0.3); color: #fff;">Settings</a>
      <button class="logout-btn" id="logout-btn">Log Out</button>
    </div>
  </header>

  <main>
    <div class="container">
      <h1>Account Settings</h1>

      <div class="form-group">
        <label>Logged in as User</label>
        <input type="text" id="settings-username" readonly style="opacity: 0.7; cursor: not-allowed;">
      </div>

      <div class="divider-line"></div>

      <div class="section-title">Change Password</div>
      <div class="form-group">
        <label>New Password</label>
        <input type="password" id="new-password" placeholder="Enter new password...">
      </div>
      <button class="action-btn" onclick="updatePassword()" style="margin-bottom: 10px;">Update Password</button>

      <div class="divider-line"></div>

      <div class="section-title" style="color: #fca5a5;">Danger Zone</div>
      <button class="action-btn danger-btn" onclick="clearLocalData()">Reset / Clear Local Storage Data</button>
    </div>
  </main>

  <script>
    function navigateTo(page) {
      const path = window.location.pathname;
      const dir = path.substring(0, path.lastIndexOf('/') + 1);
      window.location.href = window.location.origin + dir + page;
    }

    const currentUser = localStorage.getItem('lucid_current_user');
    if (!currentUser) {
      navigateTo('index.html');
    } else {
      document.getElementById('settings-username').value = currentUser;
    }

    function updatePassword() {
      const newPass = document.getElementById('new-password').value.trim();
      if (!newPass) {
        alert("Please enter a valid new password.");
        return;
      }
      let users = JSON.parse(localStorage.getItem('lucid_users')) || [];
      let userObj = users.find(u => u.username.toLowerCase() === currentUser.toLowerCase());
      if (userObj) {
        userObj.password = newPass;
        localStorage.setItem('lucid_users', JSON.stringify(users));
        alert("Password successfully updated!");
        document.getElementById('new-password').value = '';
      } else {
        alert("User record not found.");
      }
    }

    function clearLocalData() {
      if (confirm("Are you sure you want to clear all app data? This will log you out and delete user accounts.")) {
        localStorage.clear();
        navigateTo('index.html');
      }
    }

    document.getElementById('logout-btn').addEventListener('click', () => {
      localStorage.removeItem('lucid_current_user');
      navigateTo('index.html');
    });
  </script>
</body>
</html>
