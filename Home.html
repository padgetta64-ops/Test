<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lucid - Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-image: url('background.png');
      background-repeat: repeat;
      background-size: 500px auto;
      animation: scroll 20s linear infinite;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
      background-color: #0f051d;
    }
    @keyframes scroll {
      from { background-position: 0 0; }
      to { background-position: 500px 500px; }
    }
    header {
      width: 100%;
      max-width: 680px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .nav-group {
      display: flex;
      gap: 10px;
    }
    .nav-btn, .logout-btn {
      background: rgba(26, 11, 46, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(168, 85, 247, 0.3);
      color: #e9d5ff;
      padding: 10px 18px;
      font-weight: 600;
      font-size: 14px;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .nav-btn:hover, .logout-btn:hover {
      background: rgba(147, 51, 234, 0.3);
      border-color: #c084fc;
      color: #fff;
      transform: translateY(-1px);
    }
    main {
      width: 100%;
      max-width: 680px;
    }
    .view {
      background: rgba(26, 11, 46, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 35px;
      border-radius: 20px;
      border: 1px solid rgba(168, 85, 247, 0.25);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(147, 51, 234, 0.15);
    }
    .profile-header-section {
      background-size: cover;
      background-position: center;
      background-color: #1e1b4b;
      padding: 28px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      gap: 22px;
      position: relative;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
      border: 1px solid rgba(168, 85, 247, 0.2);
    }
    .player-circle-container {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 3px solid #c084fc;
      background: #090214;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    }
    #profile-canvas-container {
      width: 100%;
      height: 100%;
    }
    .player-name {
      font-size: 26px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.7);
      letter-spacing: -0.5px;
    }
    .divider-line {
      height: 1px;
      background: rgba(168, 85, 247, 0.25);
      margin: 30px 0;
    }
    .customization-panel {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .section-title {
      font-size: 18px;
      font-weight: 700;
      color: #f3e8ff;
      margin-bottom: 4px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: #d8b4fe;
    }
    .form-group textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 12px;
      font-size: 14px;
      background: rgba(15, 5, 29, 0.6);
      color: #fff;
      resize: vertical;
      transition: all 0.25s;
    }
    .form-group input[type="file"] {
      font-size: 13px;
      color: #d8b4fe;
      padding: 6px 0;
    }
    .form-group textarea:focus {
      outline: none;
      border-color: #c084fc;
      background-color: rgba(15, 5, 29, 0.9);
      box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.2);
    }
    .action-btn {
      padding: 14px;
      background: linear-gradient(135deg, #a855f7, #7e22ce);
      border: none;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
    }
    .action-btn:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }
    .action-btn:active {
      transform: scale(0.98);
    }
  </style>

  <!-- Include Three.js & GLTFLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <header>
    <div class="nav-group">
      <a href="home.html" class="nav-btn" style="border-color: #c084fc; background: rgba(147, 51, 234, 0.3); color: #fff;">Dashboard</a>
      <a href="games.html" class="nav-btn">Games</a>
    </div>
    <div class="nav-group">
      <a href="settings.html" class="nav-btn">Settings</a>
      <button class="logout-btn" id="logout-btn">Log Out</button>
    </div>
  </header>

  <main>
    <section id="profile-view" class="view">
      <div class="profile-header-section" id="profile-banner">
        <div class="player-circle-container">
          <div id="profile-canvas-container"></div>
        </div>
        <div>
          <div class="player-name" id="profile-display-name">name of player</div>
          <p id="profile-display-bio" style="color: #e9d5ff; margin-top: 4px; font-style: italic; font-size: 14px; opacity: 0.8;">No bio written yet...</p>
        </div>
      </div>

      <div class="divider-line"></div>

      <div class="customization-panel">
        <div class="section-title">Profile Customization</div>
        
        <div class="form-group">
          <label>Biography</label>
          <textarea id="input-bio" rows="3" placeholder="Tell the world about yourself..." oninput="updateBio()"></textarea>
        </div>

        <div class="form-group">
          <label>Upload player.gltf Avatar (Cost: 50 Luis)</label>
          <input type="file" id="gltf-file-input" accept=".gltf,.glb">
          <button class="action-btn" onclick="uploadPlayerModel()" style="margin-top: 6px;">Upload Model</button>
        </div>

        <div class="form-group">
          <label>Profile Banner Image</label>
          <input type="file" id="bg-file-input" accept="image/*" onchange="updateBackgroundBanner(event)">
        </div>
      </div>
    </section>
  </main>

  <script>
    function navigateTo(page) {
      const path = window.location.pathname;
      const dir = path.substring(0, path.lastIndexOf('/') + 1);
      window.location.href = window.location.origin + dir + page;
    }

    const currentUser = localStorage.getItem('lucid_current_user');
    if (!currentUser) {
      navigateTo('index.html');
    } else {
      document.getElementById('profile-display-name').textContent = currentUser;
      
      let users = JSON.parse(localStorage.getItem('lucid_users')) || [];
      let userObj = users.find(u => u.username.toLowerCase() === currentUser.toLowerCase());
      if (userObj && userObj.bio) {
        document.getElementById('input-bio').value = userObj.bio;
        const bioEl = document.getElementById('profile-display-bio');
        bioEl.textContent = userObj.bio;
        bioEl.style.fontStyle = 'normal';
        bioEl.style.opacity = '1';
      }
    }

    let scene, camera, renderer, currentModel;
    function init3DViewer() {
      const container = document.getElementById('profile-canvas-container');
      scene = new THREE.Scene();
      
      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(0, 1.5, 3);

      renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      container.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
      scene.add(ambientLight);
      const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
      directionalLight.position.set(5, 10, 7);
      scene.add(directionalLight);

      const geometry = new THREE.BoxGeometry(1, 1, 1);
      const material = new THREE.MeshStandardMaterial({ color: 0xc084fc, roughness: 0.3 });
      currentModel = new THREE.Mesh(geometry, material);
      scene.add(currentModel);

      animate3D();
    }

    function animate3D() {
      requestAnimationFrame(animate3D);
      if (currentModel) {
        currentModel.rotation.y += 0.01;
      }
      renderer.render(scene, camera);
    }
    init3DViewer();

    function updateBio() {
      const bioVal = document.getElementById('input-bio').value.trim();
      const bioEl = document.getElementById('profile-display-bio');
      if (bioVal) {
        bioEl.textContent = bioVal;
        bioEl.style.fontStyle = 'normal';
        bioEl.style.opacity = '1';
      } else {
        bioEl.textContent = "No bio written yet...";
        bioEl.style.fontStyle = 'italic';
        bioEl.style.opacity = '0.8';
      }

      let users = JSON.parse(localStorage.getItem('lucid_users')) || [];
      let userObj = users.find(u => u.username.toLowerCase() === currentUser.toLowerCase());
      if (userObj) {
        userObj.bio = bioVal;
        localStorage.setItem('lucid_users', JSON.stringify(users));
      }
    }

    function uploadPlayerModel() {
      const fileInput = document.getElementById('gltf-file-input');
      if (!fileInput || fileInput.files.length === 0) {
        alert("Please select a .gltf or .glb file first!");
        return;
      }

      const file = fileInput.files[0];
      const url = URL.createObjectURL(file);

      const loader = new THREE.GLTFLoader();
      loader.load(url, (gltf) => {
        if (currentModel) {
          scene.remove(currentModel);
        }
        currentModel = gltf.scene;
        
        const box = new THREE.Box3().setFromObject(currentModel);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        const scale = 1.5 / maxDim;
        currentModel.scale.set(scale, scale, scale);
        currentModel.position.sub(center.multiplyScalar(scale));

        scene.add(currentModel);
        alert(`Successfully loaded model: ${file.name} (Cost: 50 Luis processed)`);
      }, undefined, (error) => {
        console.error("Error loading glTF model:", error);
        alert("Failed to parse .gltf file format.");
      });
    }

    function updateBackgroundBanner(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const banner = document.getElementById('profile-banner');
          if (banner) {
            banner.style.backgroundImage = `url('${e.target.result}')`;
          }
        }
        reader.readAsDataURL(file);
      }
    }

    document.getElementById('logout-btn').addEventListener('click', () => {
      localStorage.removeItem('lucid_current_user');
      navigateTo('index.html');
    });
  </script>
</body>
</html>
